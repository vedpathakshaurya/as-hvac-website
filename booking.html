<main>


<section class="hero">
  <h2>Book HVAC Service Online</h2>
</section>

<section class="section">
  <h3>Schedule Your Appointment</h3>

  <div class="booking-form">
    <select id="service" aria-label="Select Service">
      <option value="AC Repair">AC Repair</option>
      <option value="Heating Repair">Heating Repair</option>
      <option value="Furnace Installation">Furnace Installation</option>
      <option value="Air Quality Service">Air Quality Service</option>
      <option value="Emergency HVAC">Emergency HVAC</option>
    </select>

    <input type="text" id="name" placeholder="Your Name" aria-label="Your Name" required />
    <input type="tel" id="phone" placeholder="Phone Number" aria-label="Phone Number" required />
    <input type="text" id="address" placeholder="Address" aria-label="Address" required />
    <textarea id="details" placeholder="Describe your HVAC issue" aria-label="Describe your HVAC issue"></textarea>

    <button type="button" onclick="sendSMS()">Submit Request</button>
    <button type="button" onclick="sendEmail()">Email Request</button>
    <button type="button" onclick="copyRequest()">Copy Request</button>
  </div>
</section>
